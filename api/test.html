<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>live2d 引擎修复测试</title>
<style>body{margin:0;height:100vh;background:#20222a}</style>
</head>
<body>
<script>
  localStorage.setItem('modelId', '0');
  var base = '/api/';
  var v = '?v=' + Date.now();

  var st = document.createElement('style');
  st.textContent = '#waifu{position:fixed!important;left:0!important;bottom:0!important;z-index:9999!important;opacity:1!important;display:block!important}#waifu.waifu-active{bottom:0!important;transform:none!important}';
  document.head.appendChild(st);

  var css = document.createElement('link');
  css.rel = 'stylesheet';
  css.href = '/waifu.css' + v;
  document.head.appendChild(css);

  var s = document.createElement('script');
  s.type = 'module';
  s.src = base + 'waifu-tips.js' + v;
  document.head.appendChild(s);

  var tries = 0;
  var t = setInterval(function () {
    if (typeof window.initWidget === 'function') {
      clearInterval(t);
      initWidget({
        waifuPath: base + 'waifu-tips.json',
        cdnPath: base,
        cubism2Path: 'https://fastly.jsdelivr.net/npm/live2d-widgets@1.0.0-rc.7/dist/live2d.min.js',
        cubism5Path: 'https://cubism.live2d.com/sdk-web/cubismcore/live2dcubismcore.min.js',
        tools: ['hitokoto', 'switch-model', 'photo', 'quit'],
        drag: false
      });
      var b = document.createElement('script');
      b.src = base + 'char-engine.js' + v;
      document.head.appendChild(b);
    } else if (++tries > 100) {
      clearInterval(t);
      document.title = 'initWidget 未加载';
    }
  }, 100);
</script>
</body>
</html>
